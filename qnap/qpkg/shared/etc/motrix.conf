# Administrative configuration. Keep this file owned by root/admin.
# Empty paths select the installation volume and the Download share.
PORT=16880
MDXP_PORT=16881
DATA_DIR=
DOWNLOAD_DIR=
RUN_USER=admin
# Empty selects the configured account primary group.
RUN_GROUP=
PUBLIC_URL=
HOST_LANGUAGE=zh-CN

# Colon-separated absolute NAS share paths. Each must be writable by RUN_USER.
# Empty keeps the default download directory as the only allowed root.
ALLOWED_SAVE_DIRS=

# Optional absolute path to a private custom token file (mode 0600).
# Empty uses upstream automatic token provisioning. Never commit a real token.
OPERATOR_TOKEN_FILE=
